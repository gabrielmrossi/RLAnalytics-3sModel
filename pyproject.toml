[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-analytics"
version = "0.2.0"
description = "Plataforma de análise de telemetria e detecção de erros táticos para Rocket League 3v3 (TCC)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gabriel Rossi"}
]
dependencies = [
    "joblib==1.5.3",
    "numpy==2.4.3",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
core = [
    "joblib==1.5.3",
    "numpy==2.4.3",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "scikit-learn==1.9.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.6.0",
]
ui = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
rl-analyze = "rl_analytics.facade:main"
rl-seed-catalog = "rl_analytics_api.seed:main"
rl-build-dataset = "scripts.build_dataset:main"
rl-train = "scripts.train_models:main"
rl-export-figures = "scripts.export_figures:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_analytics*", "rl_analytics_api*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
