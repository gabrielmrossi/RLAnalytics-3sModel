[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-analytics"
version = "0.1.0"
description = "Plataforma de análise de telemetria e detecção de erros táticos para Rocket League 3v3 (TCC)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gabriel Rossi"}
]
dependencies = [
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
rl-build-dataset = "scripts.build_dataset:main"
rl-train = "scripts.train_models:main"
rl-export-figures = "scripts.export_figures:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
